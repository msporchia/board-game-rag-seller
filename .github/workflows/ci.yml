name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Runs `ruff check` with the repo's ruff.toml; no Python setup needed.
      - uses: astral-sh/ruff-action@v4.0.0

  unit-tests:
    name: Unit tests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -r requirements.txt pytest

      # Deterministic, fully offline suite (no Ollama/Qdrant). The LLM evals and
      # e2e tests need local models and are run explicitly outside CI
      # (see docs/observability.md).
      - name: Run unit tests
        run: uv run pytest tests/unit -q
