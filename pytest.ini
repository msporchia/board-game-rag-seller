[pytest]
# Default run = only the deterministic unit tests (offline). The LLM evals are launched
# explicitly: `pytest tests/eval` (they require Ollama).
testpaths = tests/unit

markers =
    llm: requires a running Ollama (quality eval of the LLM steps). Excluded from the offline unit run.
    e2e: full enrichment end-to-end (real LLM + embeddings + DBs). Run explicitly: pytest tests/e2e.
